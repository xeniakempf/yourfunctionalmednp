# Netlify publishes only the finished pages in site/. The source in src/ is never served.
[build]
  publish = "site"
  command = ""

# Server-side code (e.g. emailing the estradiol chart). Secrets live in Netlify environment variables, never in this repo.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
